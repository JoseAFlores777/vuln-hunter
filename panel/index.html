<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com 'sha256-ttcGFxz/CW2f2qNsp8wIYrdV5I7WnPmtOuh60P/S0uc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>vuln-hunter // panel vivo</title>
<!-- Versiones FIJAS + SRI: si el CDN se compromete o hay MITM, el navegador
     rechaza un script alterado. El JSX se PRE-COMPILA (scripts/build-panel.sh)
     a JS plano inline, asi no hace falta Babel-en-navegador ni 'unsafe-eval'
     y la CSP de arriba puede ser estricta. Fuente editable: panel/app.jsx. -->
<script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070a0f;--bg-2:#0a0e16;--panel:#0e1420;--panel-2:#111a28;
    --ink:#e6edf6;--ink-soft:#aebacb;--ink-mute:#6b7889;
    --line:rgba(120,160,200,.12);--line-2:rgba(120,160,200,.22);
    --green:#22c55e;--green-soft:#4ade80;--cyan:#22d3ee;--cyan-soft:#67e8f9;
    --amber:#f59e0b;--orange:#fb923c;--red:#ef4444;--violet:#a78bfa;
    --glow-cyan:0 0 0 1px rgba(34,211,238,.35),0 0 22px -4px rgba(34,211,238,.5);
    --glow-green:0 0 0 1px rgba(34,197,94,.35),0 0 22px -4px rgba(34,197,94,.5);
    --mono:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;
    --term:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --hud:'Share Tech Mono',var(--mono);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* backdrop layers (cohesion con el landing) */
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 30%,transparent 80%)}
  .bg-glow{position:fixed;z-index:0;pointer-events:none;filter:blur(90px);opacity:.45}
  .bg-glow.g1{top:-200px;left:-140px;width:520px;height:520px;background:radial-gradient(circle,rgba(34,211,238,.32),transparent 65%)}
  .bg-glow.g2{top:420px;right:-180px;width:560px;height:560px;background:radial-gradient(circle,rgba(34,197,94,.18),transparent 65%)}
  .scanline{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:overlay}
  @media (prefers-reduced-motion:reduce){.scanline{display:none}}

  .wrap{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:34px 24px 90px}

  /* header */
  .brand{font-family:var(--hud);font-size:clamp(24px,4vw,34px);letter-spacing:1px;display:flex;align-items:center;gap:12px;margin:0 0 6px;flex-wrap:wrap}
  .brand .bdot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2.2s infinite}
  .brand .slash{color:var(--cyan)}
  .brand .liveword{font-family:var(--mono);font-size:12px;color:var(--green-soft);border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.07);border-radius:999px;padding:2px 10px;letter-spacing:1px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sub{color:var(--ink-mute);font-family:var(--mono);font-size:12.5px;margin-bottom:26px;overflow-wrap:anywhere}
  .sub b{color:var(--ink-soft)}

  /* eyebrow / section label */
  .eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);display:inline-flex;align-items:center;gap:10px;margin:0 0 14px}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

  /* KEV alert (full border, sin side-stripe) */
  .alert{display:flex;gap:15px;align-items:flex-start;border:1px solid rgba(245,158,11,.32);border-radius:14px;background:linear-gradient(180deg,rgba(245,158,11,.08),transparent);padding:18px 20px;margin-bottom:24px}
  .alert .aic{flex:0 0 auto;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:rgba(245,158,11,.14);color:var(--amber);font-size:20px}
  .alert .atxt{font-size:14px;color:var(--ink-soft)}
  .alert .atxt b{color:var(--amber)}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:26px}
  .stat{background:var(--bg-2);padding:22px 16px;text-align:center}
  .stat .n{font-family:var(--hud);font-size:30px;line-height:1;color:var(--cyan)}
  .stat .l{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:8px;letter-spacing:.5px;text-transform:uppercase}

  .block{margin-bottom:26px}
  .surface{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--bg-2))}

  /* pipeline graph (escala al ancho, sin scroll horizontal) */
  .graphwrap{padding:22px 22px 16px}
  .nowline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-family:var(--mono);font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-mute);background:rgba(255,255,255,.02);display:inline-flex;align-items:center;gap:7px}
  .chip.run{border-color:var(--cyan);background:rgba(34,211,238,.08);color:var(--cyan-soft);font-weight:600;box-shadow:var(--glow-cyan)}
  .chip.block{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5;font-weight:600}
  .graphscroll{overflow:visible}
  .graph{position:relative}
  .gnode{position:absolute;width:132px;height:58px;background:rgba(255,255,255,.025);border:1px solid var(--line-2);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;justify-content:center;gap:3px;font-family:var(--mono);transition:box-shadow .2s,border-color .2s;cursor:help;outline:none}
  .gnode:hover,.gnode:focus-visible{z-index:30}
  .gnode:focus-visible{border-color:var(--cyan);box-shadow:var(--glow-cyan)}
  /* tooltip HUD: describe que hace el agente */
  .gtip{position:absolute;left:50%;top:calc(100% + 11px);transform:translateX(-50%) translateY(4px);width:232px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;box-shadow:0 18px 44px -14px rgba(0,0,0,.85),var(--glow-cyan);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease-out,transform .16s ease-out;z-index:40;text-align:left;white-space:normal}
  .gtip::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:6px solid transparent}
  .gnode:not(.tipup) .gtip::after{bottom:100%;border-bottom-color:var(--line-2)}
  .gnode.tipup .gtip{top:auto;bottom:calc(100% + 11px);transform:translateX(-50%) translateY(-4px)}
  .gnode.tipup .gtip::after{top:100%;border-top-color:var(--line-2)}
  .gnode:hover .gtip,.gnode:focus-visible .gtip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .gtip-h{font-family:var(--mono);font-size:11.5px;color:var(--cyan-soft);font-weight:700;margin-bottom:5px;display:flex;gap:6px;align-items:center}
  .gtip-b{font-family:var(--sans);font-size:11.5px;line-height:1.5;color:var(--ink-soft)}
  .gnode .gtop{display:flex;align-items:center;gap:7px}
  .gnode .glabel{font-weight:700;font-size:12.5px;color:var(--ink)}
  .gnode .gagent{font-size:10px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gnode.done{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
  .gnode.running{border-color:var(--cyan);background:rgba(34,211,238,.07);box-shadow:var(--glow-cyan)}
  .gnode.idle{opacity:.5}
  .ic{width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
  .ic.done{background:var(--green);color:var(--bg);font-weight:800}
  .ic.idle{border:2px solid var(--ink-mute)}
  .ic.spin{border:2.5px solid rgba(34,211,238,.25);border-top-color:var(--cyan);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .edge{fill:none;stroke:var(--line-2);stroke-width:2}
  .edge.done{stroke:rgba(34,197,94,.5)}
  .edge.active{stroke:var(--cyan);stroke-width:2.4;stroke-dasharray:5 4;animation:dash 1s linear infinite;filter:drop-shadow(0 0 4px rgba(34,211,238,.6))}
  @keyframes dash{to{stroke-dashoffset:-18}}

  /* bitacora = terminal */
  .terminal{overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.8)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .term-bar .tdot{width:11px;height:11px;border-radius:50%}
  .term-bar .r{background:#ff5f56}.term-bar .y{background:#ffbd2e}.term-bar .g{background:#27c93f}
  .term-bar .ttitle{margin-left:8px;font-family:var(--mono);font-size:12px;color:var(--ink-mute)}
  .blog{max-height:340px;overflow-y:auto;overflow-x:hidden;padding:14px 16px;font-family:var(--term);font-size:13px;line-height:1.5}
  .brow{display:flex;gap:12px;padding:3px 6px;border-radius:6px;overflow-wrap:anywhere}
  .brow .bt{color:var(--ink-mute);font-size:11px;white-space:nowrap;flex:0 0 auto;opacity:.8}
  .brow.find{background:rgba(34,211,238,.05)}
  .brow.block{background:rgba(239,68,68,.07)}
  .brow .g{color:var(--green-soft)}.brow .c{color:var(--cyan-soft)}.brow .a{color:var(--amber)}.brow .r{color:#fca5a5}.brow .m{color:var(--ink-mute)}
  .brow b{color:var(--ink)}
  .src{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);border:1px solid var(--line-2);border-radius:5px;padding:0 6px;margin-left:2px}

  /* severity chips + tags */
  .sev{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:1px 7px;border:1px solid currentColor}
  .tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:1px 6px;color:var(--bg)}

  /* lifecycle tabs */
  .tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .tab{font-family:var(--mono);font-size:13px;color:var(--ink-mute);background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:color .2s,border-color .2s,background .2s}
  .tab:hover{color:var(--ink-soft)}
  .tab.on{color:var(--ink);border-color:var(--line-2);background:rgba(255,255,255,.03)}
  .tab .tdot{width:8px;height:8px;border-radius:50%}
  .tab .tdot.encontrados{background:var(--amber)}
  .tab .tdot.mitigando{background:var(--cyan)}
  .tab .tdot.arreglados{background:var(--green)}
  .tab .tdot.filtrados{background:var(--ink-mute)}
  .tab .tcount{font-size:11px;color:var(--ink-mute);background:rgba(255,255,255,.05);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .tab.on .tcount{color:var(--ink);background:rgba(34,211,238,.12)}

  /* lifecycle state badge (en la fila) */
  .lbadge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 9px;border-radius:6px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .lbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .lbadge.encontrados{color:var(--amber)}
  .lbadge.mitigando{color:var(--cyan-soft)}
  .lbadge.arreglados{color:var(--green-soft)}
  .lbadge.filtrados{color:var(--ink-mute)}
  .lbadge.active{color:var(--cyan);border-color:var(--cyan);background:rgba(34,211,238,.1)}
  .lbadge.active::before{animation:pulse 1.1s infinite}

  /* findings table */
  .tablecard{overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:auto}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:rgba(255,255,255,.02);font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-mute)}
  tr.frow{cursor:pointer}
  tr.frow:hover{background:rgba(34,211,238,.04)}
  tr.frow.arreglados{background:rgba(34,197,94,.035)}
  tr.frow.arreglados:hover{background:rgba(34,197,94,.07)}
  td{color:var(--ink-soft);overflow-wrap:anywhere}
  code{font-family:var(--mono);background:rgba(34,211,238,.08);color:var(--cyan-soft);padding:1px 5px;border-radius:4px;font-size:.86em;overflow-wrap:anywhere;word-break:break-word}
  .pill{font-family:var(--mono);display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;border:1px solid var(--line-2);color:var(--ink-mute)}
  @keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  tbody.swap tr.frow{animation:rowin .35s cubic-bezier(.2,.7,.2,1) both}

  /* detalle de vulnerabilidad */
  .detail{background:var(--panel-2)}
  .detail .dcell{padding:18px 18px 6px}
  .dhead{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .dchips{display:flex;gap:7px;flex-wrap:wrap}
  .dchip{font-family:var(--mono);font-size:11px;color:var(--ink-mute);border:1px solid var(--line-2);border-radius:6px;padding:2px 8px}
  .dchip b{color:var(--ink-soft)}
  .facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:0 30px}
  .facet{padding:13px 0;border-bottom:1px solid var(--line)}
  .facet.wide{grid-column:1/-1}
  .facet.good{background:linear-gradient(180deg,rgba(34,197,94,.06),transparent);border-radius:8px;padding:13px 14px;margin:4px 0}
  .flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--cyan-soft);margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .facet.good .flabel{color:var(--green-soft)}
  .fval{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
  .fval .ok{color:var(--green-soft)}
  /* kill chain */
  .killchain{list-style:none;margin:8px 0 2px;padding:0}
  .killchain li{display:flex;gap:12px;align-items:flex-start;padding:6px 0;position:relative}
  .killchain li:not(:last-child)::before{content:"";position:absolute;left:11px;top:27px;bottom:-6px;width:1px;background:rgba(239,68,68,.3)}
  .killchain .kn{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-family:var(--hud);font-size:12px;display:grid;place-items:center}
  .killchain .kt{font-size:13px;color:var(--ink-soft);padding-top:2px;overflow-wrap:anywhere}
  /* lifecycle track (en detalle) */
  .ltrack{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px}
  .lstep{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-mute);white-space:nowrap}
  .lstep .ld{width:8px;height:8px;border-radius:50%;background:var(--ink-mute)}
  .lstep.past{color:var(--green-soft);border-color:rgba(34,197,94,.4)}
  .lstep.past .ld{background:var(--green)}
  .lstep.done{color:var(--green-soft);border-color:var(--green);background:rgba(34,197,94,.1)}
  .lstep.done .ld{background:var(--green)}
  .lstep.cur{color:var(--cyan-soft);border-color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:var(--glow-cyan)}
  .lstep.cur .ld{background:var(--cyan);animation:pulse 1.6s infinite}
  .lstep.future{opacity:.5}
  .lbar{width:20px;height:1px;background:var(--line-2);flex:0 0 auto}
  .lbar.on{background:rgba(34,197,94,.55)}
  .ltrack.filtered{color:var(--ink-mute);font-style:italic;border:1px dashed var(--line-2);border-radius:999px;padding:4px 12px}

  /* comandos copiables de Claude Code */
  .cmdbar{display:flex;gap:10px;flex-wrap:wrap}
  .cmd{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:border-color .2s,box-shadow .2s,color .2s;text-align:left}
  .cmd:hover{border-color:var(--cyan);color:var(--ink);box-shadow:var(--glow-cyan)}
  .cmd.primary{border-color:rgba(34,197,94,.4)}
  .cmd.primary:hover{border-color:var(--green);box-shadow:var(--glow-green)}
  .cmd .cmd-ic{font-size:13px;color:var(--ink-mute)}
  .cmd:hover .cmd-ic{color:var(--cyan)}
  .cmd .cmd-l{font-weight:600}
  .cmd .cmd-c{font-size:11.5px;color:var(--cyan-soft);background:rgba(34,211,238,.07);padding:1px 6px;border-radius:5px}
  .cmd.primary .cmd-c{color:var(--green-soft);background:rgba(34,197,94,.08)}
  .cmd.ok{border-color:var(--green);color:var(--green-soft)}
  .cmd.ok .cmd-ic{color:var(--green)}
  .csel{width:36px;text-align:center}
  .csel input{accent-color:var(--cyan);cursor:pointer;width:15px;height:15px}
  tr.frow.sel{background:rgba(34,211,238,.07)}
  tr.frow.active{background:rgba(34,211,238,.06);box-shadow:inset 3px 0 0 var(--cyan)}
  .fixed-what{font-size:11.5px;color:var(--green-soft);margin-top:3px;overflow-wrap:anywhere}
  .copybtn{font-family:var(--mono);background:rgba(255,255,255,.03);border:1px solid var(--line-2);color:var(--ink-mute);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px;transition:color .2s,border-color .2s,box-shadow .2s}
  .copybtn:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:var(--glow-cyan)}
  .copybtn.ok{color:var(--green);border-color:var(--green)}
  .copy-na{color:var(--ink-mute);opacity:.5}
  .seltool{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(34,211,238,.04)}
  .seln{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)}
  .seln b{color:var(--cyan-soft)}
  .selcmds{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .selclear{background:transparent;border:1px solid var(--line-2);color:var(--ink-mute);border-radius:8px;padding:7px 11px;cursor:pointer;font-family:var(--mono);font-size:12px}
  .selclear:hover{color:var(--ink)}
  .dcmds{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .dcmds-l{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute);margin-right:2px}

  .empty{color:var(--ink-mute);text-align:center;padding:44px;font-size:14px}
  footer{margin-top:30px;color:var(--ink-mute);font-family:var(--mono);font-size:11.5px;border-top:1px solid var(--line);padding-top:18px;overflow-wrap:anywhere}
  footer b{color:var(--cyan-soft)}

  /* glosario: tooltip para abreviaciones (SAST, CVSS, KEV, ...) */
