name: Release

# Disparado al empujar un tag vX.Y.Z (ver scripts/release.sh).
# El sync de version a los manifests lo hace scripts/release.sh ANTES de taggear
# (localmente, por la persona). Este workflow NO muta main: solo valida el arbol
# del tag, corre tests sobre ese arbol exacto y publica el GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

# Solo se necesita escritura para publicar el Release (gh release). NO se hace
# push a ninguna branch: este workflow no escribe codigo en main.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tag (el arbol que se publica)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar el tag (semver vX.Y.Z)
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} no es semver vX.Y.Z"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: El tag debe apuntar a un commit de main (provenance)
        run: |
          # El tag no puede apuntar a un commit ajeno/sin revisar: exigimos que sea
          # ancestro de origin/main para que el arbol publicado venga de main.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} no esta en main; taggea solo commits de main"
            exit 1
          fi

      - name: Los manifests del tag ya deben tener la version (sync local)
        run: |
          # release.sh sincroniza y commitea la version ANTES de taggear. Si el tag
          # no la lleva, falla: NO la arreglamos aqui (no mutamos main desde CI).
          if ! python3 scripts/bump-version.py --check "${{ steps.ver.outputs.version }}"; then
            echo "::error::Los manifests del tag no estan en ${{ steps.ver.outputs.version }}. Usa scripts/release.sh para sincronizar y taggear."
            exit 1
          fi

      - name: Tests (sobre el arbol del tag)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Crear / actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
