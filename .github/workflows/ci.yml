name: CI

# Corre en cada push/PR a main: tests + consistencia de version entre manifests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Acciones pineadas por SHA de commit (no por tag movible): cierra el vector
      # supply-chain de un tag reescrito. dependabot las actualiza con revision.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Consistencia de version (plugin.json == marketplace.json)
        run: python3 scripts/bump-version.py --check
