name: CI

# Corre en cada push/PR a main: tests + consistencia de version entre manifests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Consistencia de version (plugin.json == marketplace.json)
        run: python3 scripts/bump-version.py --check
